[package]
name = "trading_bot_1"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
default_run = "live_paper"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
barter-data = "0.10"
barter-instrument = "0.3"
rust_ti = "2"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
futures-util = "0.3"
ctrlc = "3"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
csv = "1.4.0"

[[bin]]
name = "live_paper"
path = "src/bin/live_paper.rs"

[[bin]]
name = "backtest_all"
path = "src/bin/backtest_all.rs"
